name: Panneau de contributions

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours a 03h17 UTC
  workflow_dispatch:        # declenchable a la main
  push:
    branches: [main]
    paths: [scripts/contrib-panel.ps1, .github/workflows/contributions.yml]

permissions:
  contents: write

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer assets/contributions.svg
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/contrib-panel.ps1 -Login ${{ github.repository_owner }}

      - name: Publier si le panneau a change
        run: |
          if [ -n "$(git status --porcelain assets/contributions.svg)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contributions.svg
            git commit -m "Panneau de contributions : $(date -u +%F)"
            git push
          else
            echo "Aucun changement."
          fi
