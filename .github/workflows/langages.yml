name: Panneau des langages

on:
  schedule:
    - cron: "17 3 * * *"    # chaque nuit a 03h17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/langages.ps1
      - .github/workflows/langages.yml

permissions:
  contents: write

concurrency:
  group: panneau-langages
  cancel-in-progress: true

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer les deux versions du panneau
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/langages.ps1 -Login ${{ github.repository_owner }}

      - name: Publier si le panneau a change
        run: |
          if [ -n "$(git status --porcelain assets/langages-dark.svg assets/langages-light.svg)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/langages-dark.svg assets/langages-light.svg
            git commit -m "Panneau des langages : $(date -u +%F)"
            git push
          else
            echo "Aucun changement."
          fi
